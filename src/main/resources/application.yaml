spring:
  application:
    name: notiguide

  config:
    import: optional:application-${spring.profiles.active}.yaml

  jackson:
    time-zone: UTC

server:
  forward-headers-strategy: framework

jwt:
  private-key-password: ${JWT_PRIVATE_KEY_PASSWORD}

mqtt:
  broker: ${MQTT_BROKER:}
  client-id: ${MQTT_CLIENT_ID:notiguide-server}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  topic-prefix: notiguide
  qos: 1
  keep-alive-seconds: 60
  connection-timeout-seconds: 30
  auto-reconnect: true
  max-reconnect-delay-seconds: 128

app:
  timezone: Asia/Ho_Chi_Minh
  cors:
    allowed-origins:
      - http://localhost:3000
  cookie:
    name: auth_token
    secure: false
    same-site: Strict
    domain:
    path: /api

spring:
  application:
    name: notiguide

  config:
    import: optional:application-${spring.profiles.active}.yaml

  jackson:
    time-zone: UTC

server:
  forward-headers-strategy: framework

jwt:
  private-key-password: ${JWT_PRIVATE_KEY_PASSWORD}

mqtt:
  broker: ${MQTT_BROKER:}
  client-id: ${MQTT_CLIENT_ID:notiguide}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  topic-prefix: notiguide
  qos: 1
  keep-alive-seconds: 60
  connection-timeout-seconds: 30
  auto-reconnect: true
  max-reconnect-delay-seconds: 128

device:
  rf-code:
    default-bits-433m: 32
    default-bits-24g: 40
    pt2272-toggle-channel: 1
    pt2272-detoggle-channel: 0
  transmitter:
    enabled: ${DEVICE_TRANSMITTER_ENABLED:true}
    heartbeat-interval-seconds: 10
    heartbeat-liveness-seconds: 30
    active-cache-seconds: 60
    max-registered-per-store: 3
    dispatch-ack-timeout-seconds: 30

store:
  slug:
    grace-period-days: 30
    grace-delete-task-delay-ms: 21600000

app:
  timezone: Asia/Ho_Chi_Minh


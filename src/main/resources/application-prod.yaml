spring:
  r2dbc:
    url: ${SPRING_R2DBC_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    pool:
      initial-size: 5
      max-size: 10
      max-idle-time: 30m
      validation-query: SELECT 1

  data:
    redis:
      host: redis
      password: ${REDIS_PASSWORD}

jwt:
  public-key: ${JWT_PUBLIC_KEY}
  private-key: ${JWT_PRIVATE_KEY}

app:
  cors:
    allowed-origins:
      - https://xephang.online
      - https://admin.xephang.online
  cookie:
    name: ${APP_COOKIE_NAME:auth_token}
    secure: ${APP_COOKIE_SECURE:true}
    same-site: ${APP_COOKIE_SAME_SITE:Strict}
    domain: ${APP_COOKIE_DOMAIN:}
    path: ${APP_COOKIE_PATH:/api}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

rate-limit:
  enabled: true
  strict:
    window-seconds: 60
    max-requests: 20
  auth:
    window-seconds: 60
    max-requests: 10
  standard:
    window-seconds: 60
    max-requests: 60


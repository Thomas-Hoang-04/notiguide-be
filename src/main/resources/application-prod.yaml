spring:
  r2dbc:
    url: ${SPRING_R2DBC_URL}
    username: ${SPRING_R2DBC_USERNAME}
    password: ${SPRING_R2DBC_PASSWORD}
    pool:
      initial-size: 5
      max-size: 10
      max-idle-time: 30m
      validation-query: SELECT 1

  data:
    redis:
      host: redis
      password: ${REDIS_PASSWORD}

jwt:
  public-key: ${JWT_PUBLIC_KEY}
  private-key: ${JWT_PRIVATE_KEY}

app:
  cors:
    allowed-origins:
      - https://xephang.online
      - https://admin.xephang.online
  cookie:
    name: ${APP_COOKIE_NAME}
    secure: true
    same-site: None
    domain:
    path: ${APP_COOKIE_PATH}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

rate-limit:
  enabled: true
  strict:
    window-seconds: 60
    max-requests: 20
  auth:
    window-seconds: 60
    max-requests: 10
  standard:
    window-seconds: 60
    max-requests: 60

device:
  command-signing:
    pk: ${DEVICE_CMD_SIGNING_PK:}
  rf-code:
    encryption-key: ${DEVICE_RF_CODE_ENCRYPTION_KEY:}
  enrollment:
    token-ttl-seconds: ${DEVICE_ENROLLMENT_TTL_SECONDS:600}
